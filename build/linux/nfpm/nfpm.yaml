name: "yukihub"
arch: "${GOARCH}"
platform: "linux"
version: "${VERSION}"
section: "utils"
priority: "optional"
maintainer: "${MAINTAINER}"
description: "YukiHub game library manager"
vendor: "YukiHub"
homepage: "https://github.com/xm486/YukiHub-for-Desktop"
license: "AGPL-3.0"
release: "1"

contents:
  - src: "./build/bin/YukiHub-linux-launcher"
    dst: "/usr/bin/YukiHub"
    file_info:
      mode: 0755
  - src: "./build/bin/YukiHub"
    dst: "/usr/lib/yukihub/YukiHub"
    file_info:
      mode: 0755
  - src: "./build/bin/7zz"
    dst: "/usr/lib/yukihub/7zz"
    file_info:
      mode: 0755
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/com.yukihub.desktop.png"
    file_info:
      mode: 0644
  - src: "./build/linux/desktop"
    dst: "/usr/share/applications/com.yukihub.desktop.desktop"

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - xdg-utils

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - xdg-utils
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - xdg-utils

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
