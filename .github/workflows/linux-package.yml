# Linux（amd64）打包：仅手动触发。
#
# 用途：在不需要 Windows 签名凭据的情况下，单独产出 Linux 安装包
# （deb / rpm / AppImage），不创建 release / pre-release，也不改动任何 tag。
#
# 构建依赖与发布流水线中的 Linux 作业完全一致：
# GTK4 / WebKitGTK 6.0 开发库、nFPM、appimagetool、匹配版本的 Wails v3 CLI，
# 以及必须执行的 scripts/patch-wails-linux-tray.sh。
name: Linux 安装包（仅构建）

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则使用 0.0.0-dev.<提交数>+<短 SHA>）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: 构建 Linux amd64 安装包
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="0.0.0-dev.$(git rev-list --count HEAD)+$(git rev-parse --short=7 HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装 Linux 构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl desktop-file-utils libayatana-appindicator3-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: 安装 nFPM
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm --version

      - name: 安装 appimagetool
        shell: bash
        run: |
          set -euo pipefail
          tool_path="${RUNNER_TEMP:-/tmp}/appimagetool-x86_64.AppImage"
          curl -fsSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o "$tool_path"
          chmod 755 "$tool_path"
          sudo install -m 0755 "$tool_path" /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: 安装匹配版本的 Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: 修补 Wails Linux 托盘支持
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/patch-wails-linux-tray.sh

      - name: 构建 Linux 安装包
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          YUKIHUB_UPDATE_SERVICE_URL: ${{ vars.YUKIHUB_UPDATE_SERVICE_URL }}
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_HIKARINAGI_CLIENT_SECRET: ${{ secrets.YUKIHUB_HIKARINAGI_CLIENT_SECRET }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh all "$BUILD_VERSION" 'amd64'
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.deb' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.rpm' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.AppImage' | wc -l | tr -d ' ')" -eq 1

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ steps.version.outputs.version }}-linux-amd64
          path: |
            build/bin/YukiHub-*-linux-amd64.deb
            build/bin/YukiHub-*-linux-amd64.rpm
            build/bin/YukiHub-*-linux-amd64.AppImage
          if-no-files-found: error
