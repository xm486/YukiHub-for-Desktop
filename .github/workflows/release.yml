# 发布流水线（自上游 LunaBox 继承，YukiHub for Windows 需重新配置后使用）。
#
# 触发方式：推送 v*.*.* 标签，或手动 workflow_dispatch。
#
# 使用前必须在 GitHub 仓库中配置以下 Variables / Secrets（详见 docs/fork-setup.md）：
#   vars.UPDATE_PUBLIC_BASE_URL, vars.UPDATE_S3_ENDPOINT, vars.UPDATE_S3_REGION,
#   vars.UPDATE_S3_BUCKET, vars.YUKIHUB_BANGUMI_CLIENT_ID, vars.YUKIHUB_HIKARINAGI_CLIENT_ID,
#   vars.YUKIHUB_UMBRA_CLIENT_ID, vars.SIGNPATH_*
#   secrets.UPDATE_S3_ACCESS_KEY_ID, secrets.UPDATE_S3_SECRET_ACCESS_KEY,
#   secrets.YUKIHUB_BANGUMI_CLIENT_SECRET, secrets.YUKIHUB_TOUCHGAL_TOKEN,
#   secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN, secrets.SIGNPATH_API_TOKEN
#
# 注意：代码签名目前依赖 SignPath 的开源项目免费签名。该资格属于上游项目，
# YukiHub 必须自行申请（或改用自有代码签名证书），否则签名与更新校验环节会失败。
name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # 例如: v1.0.0, v1.2.3
  # 手动发布：先在页面右上角「Use workflow from」里**选择一个 v*.*.* 标签**再点运行 ——
  # 版本号（取自标签）、更新资产目录、changelog 段落都依赖标签；选分支会被下面的
  # validate 作业几秒内拦下，不会白等一整轮构建。
  workflow_dispatch:
    inputs:
      prerelease:
        description: '发布为预览版（pre-release）：只发 GitHub 预发布，不进入稳定更新通道'
        required: false
        type: boolean
        default: false
      build_windows:
        description: '构建 Windows（portable + installer × amd64 / arm64）'
        required: false
        type: boolean
        default: true
      build_linux:
        description: '构建 Linux（AppImage + deb + rpm，仅 amd64）'
        required: false
        type: boolean
        default: true

# 运行列表里直接看出这次发布的是哪些平台、是不是预览版
run-name: Release ${{ github.ref_name }}${{ inputs.build_windows && ' · Windows' || '' }}${{ inputs.build_linux && ' · Linux' || '' }}${{ inputs.prerelease && ' · pre-release' || '' }}

env:
  YUKIHUB_UPDATE_SERVICE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}

jobs:
  # 手动发布的前置校验：必须是 v*.*.* 标签 ref，且至少勾选一个平台。
  # 两种情况都在开局几秒内失败，不让用户等完一整轮构建才知道选错了。
  validate:
    name: Validate trigger and inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check tag ref and platform selection
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::发布必须由 v*.*.* 标签触发。手动运行时请在右上角「Use workflow from」里选择一个标签。"
              exit 1
              ;;
          esac
          if [ "${{ inputs.build_windows }}" = "false" ] && [ "${{ inputs.build_linux }}" = "false" ]; then
            echo "::error::至少要勾选一个平台（build_windows 或 build_linux）。"
            exit 1
          fi

  build-release:
    name: Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: [validate]
    # 手动运行时未勾选 Windows 就整块跳过；标签推送时 inputs 为空 → 视为勾选
    if: ${{ inputs.build_windows != false }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: arm64
            mode: portable
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
          - arch: amd64
            mode: installer
            runner: windows-2025
          - arch: arm64
            mode: installer
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install matching Wails v3 CLI
        shell: pwsh
        run: |
          $Version = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3).Trim()
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$Version"
          $Installed = (& wails3 version 2>&1 | Out-String).Trim()
          if ($Installed -ne $Version) {
            throw "wails3 version mismatch: expected $Version, found $Installed"
          }

      - name: Setup ARM64 CGO toolchain
        id: msys2-arm64
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.toolchain }}

      - name: Export ARM64 MSYS2 location
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $Location = '${{ steps.msys2-arm64.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($Location)) {
            throw 'MSYS2 location output is empty.'
          }
          "MSYS2_LOCATION=$Location" >> $env:GITHUB_ENV

      - name: Install NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Portable with script
        if: matrix.mode == 'portable'
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build.bat "portable" "${{ steps.get_version.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = "build/bin/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Build artifact not found: $Artifact"
          }
        shell: pwsh

      - name: Build Installer Payload with script
        if: matrix.mode == 'installer'
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build.bat "installer-payload" "${{ steps.get_version.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PayloadDir = "build/windows/payload/${{ matrix.arch }}"
          if (!(Test-Path "$PayloadDir/YukiHub.exe") -or !(Test-Path "build/bin/YukiHubUpdater.exe")) {
            Get-ChildItem -Path $PayloadDir -Recurse | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Installer payload must contain YukiHub.exe and YukiHubUpdater.exe."Stop"
          $Artifact = "signed/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path signed -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP "yukihub-signed-portable"
          if (Test-Path $ExtractDir) { Remove-Item $ExtractDir -Recurse -Force }
          Expand-Archive -Path $Artifact -DestinationPath $ExtractDir -Force
          $PayloadDir = (Get-ChildItem $ExtractDir -Filter "YukiHub.exe" -Recurse | Select-Object -First 1).Directory.FullName
          if ([string]::IsNullOrWhiteSpace($PayloadDir)) {
            throw "Signed portable archive does not contain YukiHub.exe."
          }
          foreach ($Name in @("YukiHub.exe", "YukiHubUpdater.exe")) {
            $Path = Join-Path $PayloadDir $Name
            if (!(Test-Path $Path)) { throw "Signed portable archive is missing $Name." }
            $Signature = Get-AuthenticodeSignature $Path
            if ($Signature.Status -ne "Valid") {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

          $RuntimeDir = Join-Path $PWD "update-runtime"
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @("YukiHub.exe", "YukiHubUpdater.exe", "duckdb.dll")) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path (Join-Path $PayloadDir "7z")) {
            Copy-Item (Join-Path $PayloadDir "7z") -Destination $RuntimeDir -Recurse -Force
          }
        shell: pwsh

      - name: Upload Portable Artifact
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable
          path: signed/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: Upload Unsigned Installer Payload
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-installer-payload
          path: build/signing/installer-payload/
          if-no-files-found: error
          retention-days: 1

      - name: Sign Installer Payload
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-installer-payload' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-payload

      - name: Build Installer from signed payload
        if: matrix.mode == 'installer'
        run: |
          $ErrorActionPreference = "Stop"
          $SignedGui = "signed-payload/YukiHub.exe"
          $SignedUpdater = "signed-payload/YukiHubUpdater.exe"
          if (!(Test-Path $SignedGui) -or !(Test-Path $SignedCli) -or !(Test-Path $SignedUpdater)) {
            Get-ChildItem -Path signed-payload -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed installer payload must contain YukiHub.exe and YukiHubUpdater.exe."
          }
          foreach ($Path in @($SignedGui, $SignedCli, $SignedUpdater)) {
            $Signature = Get-AuthenticodeSignature $Path
            if ($Signature.Status -ne "Valid") {
              throw "$(Split-Path $Path -Leaf) does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

          $PayloadDir = "build/windows/payload/${{ matrix.arch }}"
          Copy-Item $SignedGui -Destination "$PayloadDir/YukiHub.exe" -Force
          Copy-Item $SignedUpdater -Destination "build/bin/YukiHubUpdater.exe" -Force

          .\scripts\build.bat "installer-package" "${{ steps.get_version.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = "build/bin/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Installer artifact not found: $Artifact"
          }

          $RuntimeDir = Join-Path $PWD "update-runtime"
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @("YukiHubUpdater.exe", "duckdb.dll")) {
            $Source = Join-Path "build/bin" $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          foreach ($Name in @("YukiHub.exe")) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path "build/bin/7z") {
            Copy-Item "build/bin/7z" -Destination $RuntimeDir -Recurse -Force
          }
        shell: pwsh

      - name: Upload update runtime input
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: update-runtime/
          if-no-files-found: error

      - name: Upload Unsigned Installer Artifact
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-installer
          path: build/bin/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Installer Artifact
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-installer

      - name: Verify signed installer artifact
        if: matrix.mode == 'installer'
        run: |
          $ErrorActionPreference = "Stop"
          $Artifact = "signed-installer/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path signed-installer -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Signed installer artifact not found: $Artifact"
          }
        shell: pwsh

      - name: Upload Installer Artifact
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-installer
          path: signed-installer/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  build-linux:
    name: Linux amd64 / Packages
    needs: [validate]
    # 标签推送时始终构建；手动运行时还要看 build_linux 有没有勾
    if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.build_linux != false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl desktop-file-utils libayatana-appindicator3-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Install nFPM
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm --version

      - name: Install appimagetool
        shell: bash
        run: |
          set -euo pipefail
          tool_path="${RUNNER_TEMP:-/tmp}/appimagetool-x86_64.AppImage"
          curl -fsSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o "$tool_path"
          chmod 755 "$tool_path"
          sudo install -m 0755 "$tool_path" /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: Install matching Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: Patch Wails Linux tray support
        shell: bash
        run: ./scripts/patch-wails-linux-tray.sh

      - name: Build Linux packages
        shell: bash
        env:
          YUKIHUB_UPDATE_SERVICE_URL: ${{ vars.YUKIHUB_UPDATE_SERVICE_URL }}
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_HIKARINAGI_CLIENT_SECRET: ${{ secrets.YUKIHUB_HIKARINAGI_CLIENT_SECRET }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh all '${{ steps.get_version.outputs.VERSION }}' 'amd64'
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.deb' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.rpm' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.AppImage' | wc -l | tr -d ' ')" -eq 1

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ steps.get_version.outputs.VERSION }}-linux-amd64
          path: |
            build/bin/YukiHub-*-linux-amd64.deb
            build/bin/YukiHub-*-linux-amd64.rpm
            build/bin/YukiHub-*-linux-amd64.AppImage
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    # **不要**把 build-linux 加进 needs：Linux 打包链依赖 GTK4/WebKitGTK6/nfpm/appimagetool
    # 与 scripts/patch-wails-linux-tray.sh，任何一环出问题都不应该让 Windows 正式版发不出去。
    # Linux 产物是可选增量，下面按「0 个或 3 个」放行。
    needs: [validate, build-release]
    # 手动运行时允许只发一个平台：只要求「被勾选的那些平台」成功。
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/')
      && needs.validate.result == 'success'
      && (inputs.build_windows == false || needs.build-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: yukihub-*
          path: ./artifacts
          merge-multiple: true

      - name: Download signed update runtime inputs
        uses: actions/download-artifact@v4
        with:
          pattern: update-runtime-*
          path: ./update-runtime-artifacts

      - name: Display structure of downloaded files
        run: ls -R ./artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find ./artifacts -maxdepth 1 -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} ./release/ \;

          # Windows 四件套（portable / installer × amd64 / arm64）是发布的硬要求；
          # 手动运行时没勾 Windows 就不做这项断言（`!= false` 在 tag 推送时为 true）。
          if [ "${{ inputs.build_windows != false }}" = "true" ]; then
            windows_count="$(find ./release -maxdepth 1 -type f \( -name "*.zip" -o -name "*.exe" \) | wc -l | tr -d ' ')"
            test "$windows_count" -eq 4
          fi

          # Linux（deb / rpm / AppImage）为可选：build-linux 失败时这里会是 0，
          # 但只补齐一半（例如只出了 deb）说明产物链异常，仍然拦下。
          if [ "${{ startsWith(github.ref, 'refs/tags/') && inputs.build_linux != false }}" = "true" ]; then
            linux_count="$(find ./release -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) | wc -l | tr -d ' ')"
            case "$linux_count" in
              0 | 3) ;;
              *)
                echo "Linux 产物数量异常：$linux_count（应为 0 或 3）"
                exit 1
                ;;
            esac
          fi

          ls -lh ./release

      - name: Find previous stable release
        id: previous_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          CURRENT_TAG="$GITHUB_REF_NAME"
          PREVIOUS_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft,isPrerelease --jq "[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != \"$CURRENT_TAG\")][0].tagName // \"\"")"
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p previous-update-assets
          if [ -n "$PREVIOUS_TAG" ]; then
            aws s3 cp \
              "s3://${UPDATE_S3_BUCKET}/releases/${PREVIOUS_VERSION}/" \
              ./previous-update-assets/ \
              --recursive \
              --exclude "*" \
              --include "YukiHub-${PREVIOUS_VERSION}-windows-*-YukiHub.exe.zst" \
              --endpoint-url "$UPDATE_S3_ENDPOINT" || true
          fi

      - name: Install Zstandard CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Generate full and delta update assets
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          PREVIOUS_VERSION: ${{ steps.previous_release.outputs.version }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          test -n "$UPDATE_PUBLIC_BASE_URL"
          ASSET_BASE_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/assets"
          ARGS=(
            --input-root "$GITHUB_WORKSPACE/update-runtime-artifacts"
            --previous-root "$GITHUB_WORKSPACE/previous-update-assets"
            --output "$GITHUB_WORKSPACE/update-assets"
            --version "$VERSION"
            --asset-base-url "$ASSET_BASE_URL"
            --event-url "${UPDATE_PUBLIC_BASE_URL%/}/v1/events"
          )
          if [ -n "$PREVIOUS_VERSION" ]; then
            ARGS+=(--previous-version "$PREVIOUS_VERSION")
          fi
          go -C updater run ./cmd/yukihub-update-builder "${ARGS[@]}"
          jq empty "update-assets/YukiHub-${VERSION}-update-manifest.json"
          ls -lh ./update-assets

      - name: Generate update version source
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          SOURCE_FILE="sync/version.json"
          SOURCE_VERSION="$(jq -r '.version // empty' "$SOURCE_FILE")"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "$SOURCE_FILE version $SOURCE_VERSION does not match release version $VERSION" >&2
            exit 1
          fi
          cp "$SOURCE_FILE" update-assets/version.json
          jq empty update-assets/version.json

      - name: Upload update assets to S3
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          test -n "$UPDATE_S3_BUCKET"
          test -n "$UPDATE_S3_ENDPOINT"
          PREFIX="s3://${UPDATE_S3_BUCKET}/releases/${VERSION}"
          aws s3 cp ./update-assets "$PREFIX/" \
            --recursive \
            --exclude "*" \
            --include "*.zst" \
            --include "*.zsdiff" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp "update-assets/YukiHub-${VERSION}-update-manifest.json" "$PREFIX/manifest.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp update-assets/version.json "$PREFIX/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # 检查是否存在 CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # 提取当前版本的 changelog
            # 命中 ## VERSION / ## vVERSION 后，输出到下一个二级标题前为止
            awk -v version="$VERSION" '
              function normalize_heading(line, heading) {
                heading = line
                sub(/^##[[:space:]]+/, "", heading)
                sub(/^v/, "", heading)
                sub(/[[:space:]]+$/, "", heading)
                return heading
              }

              /^##[[:space:]]+/ {
                current = normalize_heading($0)
                if (found && current != version) {
                  exit
                }
                if (current == version) {
                  found = 1
                }
              }

              found {
                print
              }
            ' CHANGELOG.md > release_notes.md

            # 如果没有找到对应版本的内容，文件会是空的
            if [ ! -s release_notes.md ]; then
              echo "未找到版本 ${VERSION} 的 changelog，使用默认模板"
              rm -f release_notes.md
            fi
          fi

          # 如果没有从 CHANGELOG.md 提取到内容，使用默认模板
          if [ ! -f "release_notes.md" ]; then
            cat << EOF > release_notes.md
          ## YukiHub ${{ steps.get_version.outputs.VERSION }}

          ### 📝 更新内容

          请查看 [Commits](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          EOF
          fi

          # 添加下载说明
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          if [ "${{ inputs.prerelease == true }}" = "true" ]; then
            echo "> ⚠️ **这是一个预览版（pre-release）**：不进入应用内的稳定更新通道。" >> release_notes.md
            echo "" >> release_notes.md
          fi
          echo "### 📦 下载说明" >> release_notes.md
          echo "" >> release_notes.md
          echo "| 文件 | 说明 |" >> release_notes.md
          echo "|------|------|" >> release_notes.md
          echo "| \`*-windows-*-portable.zip\` | Windows 便携版，解压即用，数据存储在程序目录 |" >> release_notes.md
          echo "| \`*-windows-*-setup.exe\` | Windows 安装版，数据存储在 %APPDATA%\\\\YukiHub |" >> release_notes.md
          # Linux 产物是可选的（build-linux 失败不会阻断本作业），只有真的产出了才列出，
          # 避免发布说明公示并不存在的文件。
          linux_count="$(find ./release -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | wc -l | tr -d ' ')"
          if [ "$linux_count" -gt 0 ]; then
            echo "| \`*-linux-*.AppImage\` | Linux AppImage，依赖系统 GTK4 / WebKitGTK 6.0 运行库 |" >> release_notes.md
            echo "| \`*-linux-*.deb\` | Linux Debian/Ubuntu 安装包 |" >> release_notes.md
            echo "| \`*-linux-*.rpm\` | Linux Fedora/RHEL/openSUSE 安装包 |" >> release_notes.md
          fi
          echo "" >> release_notes.md
          if [ "$linux_count" -gt 0 ]; then
            echo "Windows 提供 AMD64、ARM64；Linux 提供 AMD64。" >> release_notes.md
          else
            echo "Windows 提供 AMD64、ARM64。" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "### 🔗 相关链接" >> release_notes.md
          echo "" >> release_notes.md
          echo "- [查看所有提交](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})" >> release_notes.md

          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release_notes.md
          draft: false
          # 手动勾了「发布为预览版」就是 pre-release；标签推送时 inputs 为空 → 正式版
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish stable update channel
        # 预览版不进稳定通道
        if: ${{ inputs.prerelease != true }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          aws s3 cp update-assets/version.json "s3://${UPDATE_S3_BUCKET}/channels/stable/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=60" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
