# 发布流水线（自上游 LunaBox 继承，YukiHub for Desktop 需重新配置后使用）。
#
# 触发方式：推送 v*.*.* 标签，或手动 workflow_dispatch。
#
# 使用前必须在 GitHub 仓库中配置以下 Variables / Secrets（详见 docs/fork-setup.md）：
#   vars.UPDATE_PUBLIC_BASE_URL, vars.UPDATE_S3_ENDPOINT, vars.UPDATE_S3_REGION,
#   vars.UPDATE_S3_BUCKET, vars.YUKIHUB_BANGUMI_CLIENT_ID, vars.YUKIHUB_HIKARINAGI_CLIENT_ID,
#   vars.YUKIHUB_UMBRA_CLIENT_ID, vars.SIGNPATH_*
#   secrets.UPDATE_S3_ACCESS_KEY_ID, secrets.UPDATE_S3_SECRET_ACCESS_KEY,
#   secrets.YUKIHUB_BANGUMI_CLIENT_SECRET, secrets.YUKIHUB_TOUCHGAL_TOKEN,
#   secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN, secrets.SIGNPATH_API_TOKEN
#
# 注意：代码签名依赖 SignPath 的开源项目免费签名，该资格属于上游项目。
# **签名是可选的**：配了 vars.SIGNPATH_ORGANIZATION_ID 才会提交签名，没配就自动跳过、
# 直接产出未签名产物（能装能用，只是没有 Authenticode 签名）。
name: 发布版本（Release）

on:
  push:
    tags:
      - 'v*.*.*'  # 例如: v1.0.0, v1.2.3
  # 手动发布有两种用法（validate 作业会把二者统一成一个版本号，作为下游唯一来源）：
  #   1) 在「version」里填版本号（如 1.2.3）后直接运行 —— 可以从任意分支发起，
  #      Release 建在 v1.2.3 标签上（标签不存在时由 GitHub 自动创建并指向本次提交）。
  #   2) 留空 version，则在右上角「Use workflow from」里选一个 v*.*.* 标签，用标签版本。
  # 两者都为空、或互相冲突、或 build_windows/build_linux 都没勾，都会被 validate 几秒内拦下。
  #
  # 注意版本号还要和仓库里的 sync/version.json 一致（它是稳定更新通道的版本来源），
  # 不一致时发布作业会明确报错，提示你先提交版本号变更。
  #
  # 与 autobuild.yml（开发版快照）的区别：这里的版本号由你指定，
  # 发出去的是「真实的下一个版本」，所以可以选预览版 / 正式版。
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选）：留空＝用所选的 v*.*.* 标签；填写则用它（如 1.2.3，可带 v），可从任意分支发布'
        required: false
        type: string
        default: ''
      release_channel:
        description: '发布方式：仅构建产物＝只产出 Actions 制品，不创建任何 Release；预览版＝本次发布标为 GitHub pre-release（不进稳定更新通道）；正式版＝GitHub Release ＋ 更新稳定更新通道'
        required: false
        type: choice
        default: '仅构建产物（不发布）'
        options:
          - '仅构建产物（不发布）'
          - '预览版（此标签标为 pre-release）'
          - '正式版（Release ＋ 稳定通道）'
      build_windows:
        description: '构建 Windows（portable + installer × amd64 / arm64）'
        required: false
        type: boolean
        default: true
      build_linux:
        description: '构建 Linux（AppImage + deb + rpm，仅 amd64）'
        required: false
        type: boolean
        default: true

# 运行列表里直接看出这次构建了哪些平台、走哪种发布方式
run-name: 发布 ${{ inputs.version || github.ref_name }}${{ inputs.build_windows && ' · Windows' || '' }}${{ inputs.build_linux && ' · Linux' || '' }} · ${{ inputs.release_channel || '正式版（标签触发）' }}

env:
  YUKIHUB_UPDATE_SERVICE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}

jobs:
  # 手动发布的前置校验：解析出唯一版本号（version 输入优先，其次 v*.*.* 标签），
  # 且至少勾选一个平台。所有情况都在开局几秒内失败，不让用户等完一整轮构建才知道选错了。
  # 同时把「发布方式」解析成 release / prerelease / artifact 三态，供下游作业判断。
  validate:
    name: 校验触发方式与选项 / 解析版本号
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    permissions:
      contents: read
    steps:
      - name: 解析版本号
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # 版本号来源：优先 version 输入，其次所选标签名；两者都给且不一致时直接报错。
          input_version="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
          input_version="${input_version#v}"

          tag_version=""
          case "$GITHUB_REF" in
            refs/tags/v*) tag_version="${GITHUB_REF_NAME#v}" ;;
          esac

          if [ -n "$input_version" ] && [ -n "$tag_version" ] && [ "$input_version" != "$tag_version" ]; then
            echo "::error::version 输入（$input_version）与所选标签（$GITHUB_REF_NAME）不一致。若想用标签版本，请把 version 留空。"
            exit 1
          fi

          if [ -n "$input_version" ]; then
            version="$input_version"
          elif [ -n "$tag_version" ]; then
            version="$tag_version"
          else
            echo "::error::未提供版本号：请在 version 输入里填写（如 1.2.3），或在右上角「Use workflow from」里选择一个 v*.*.* 标签。"
            exit 1
          fi

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号格式非法：$version（应形如 1.2.3 或 1.2.3-rc.1）"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "解析得到版本号 $version（标签 v$version）"

      - name: 校验平台勾选
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_windows }}" = "false" ] && [ "${{ inputs.build_linux }}" = "false" ]; then
            echo "::error::至少要勾选一个平台（build_windows 或 build_linux）。"
            exit 1
          fi

      # 标签推送时 inputs 为空 → 一律按正式版处理（保持打标签即发布的语义）。
      - name: 解析发布方式
        id: channel
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          case "$INPUT_CHANNEL" in
            '' | '正式版（Release ＋ 稳定通道）' | release)
              channel=release
              ;;
            '预览版（此标签标为 pre-release）' | prerelease)
              channel=prerelease
              ;;
            '仅构建产物（不发布）' | artifact)
              channel=artifact
              ;;
            *)
              echo "::error::未知的发布方式：$INPUT_CHANNEL"
              exit 1
              ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          case "$channel" in
            artifact)
              echo "::notice::本次只构建产物：不会创建任何 Release，也不会写入稳定更新通道。产物在本次运行的 Artifacts 区域下载。"
              ;;
            prerelease)
              echo "::notice::本次发布为预览版（pre-release）：不会更新稳定更新通道。"
              ;;
            release)
              echo "::notice::本次为完整发布：创建 GitHub Release 并更新稳定更新通道。"
              ;;
          esac

  build-release:
    name: 构建 Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: [validate]
    # 手动运行时未勾选 Windows 就整块跳过；标签推送时 inputs 为空 → 视为勾选
    if: ${{ inputs.build_windows != false }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: arm64
            mode: portable
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
          - arch: amd64
            mode: installer
            runner: windows-2025
          - arch: arm64
            mode: installer
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装匹配版本的 Wails v3 CLI
        shell: pwsh
        run: |
          $Version = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3).Trim()
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$Version"
          $Installed = (& wails3 version 2>&1 | Out-String).Trim()
          if ($Installed -ne $Version) {
            throw "wails3 version mismatch: expected $Version, found $Installed"
          }

      - name: 配置 ARM64 CGO 工具链（MSYS2）
        id: msys2-arm64
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.toolchain }}

      - name: 导出 ARM64 MSYS2 路径
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $Location = '${{ steps.msys2-arm64.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($Location)) {
            throw 'MSYS2 location output is empty.'
          }
          "MSYS2_LOCATION=$Location" >> $env:GITHUB_ENV

      - name: 安装 NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH

      - name: 读取版本号（由 validate 统一解析）
        id: get_version
        shell: bash
        run: |
          set -euo pipefail
          echo "VERSION=${{ needs.validate.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: 校验批处理行尾（.bat 必须 CRLF）
        # .gitattributes 里 *.bat 是 eol=crlf：cmd.exe 解析 LF-only 的 .bat 会把多行
        # `( )` 块和 `for /f` 拆错（满屏「'xx' 不是内部或外部命令」），Windows 构建会中途挂掉。
        shell: pwsh
        run: |
          $bad = @(Get-ChildItem scripts/*.bat | Where-Object {
            -not (Get-Content -LiteralPath $_.FullName -Raw).Contains([char]13)
          })
          if ($bad.Count -gt 0) {
            throw "以下批处理文件不是 CRLF 行尾：$($bad.Name -join ', ')。请检查 .gitattributes 的 *.bat text eol=crlf 规则并重新检出。"
          }
          Write-Host "scripts/*.bat 均为 CRLF 行尾 · OK"

      - name: 构建 Windows 便携版
        if: matrix.mode == 'portable'
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build.bat "portable" "${{ steps.get_version.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = "build/bin/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Build artifact not found: $Artifact"
          }
        shell: pwsh

      - name: 构建 Windows 安装版载荷
        if: matrix.mode == 'installer'
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          .\scripts\build.bat "installer-payload" "${{ steps.get_version.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PayloadDir = "build/windows/payload/${{ matrix.arch }}"
          if (!(Test-Path "$PayloadDir/YukiHub.exe") -or !(Test-Path "build/bin/YukiHubUpdater.exe")) {
            Get-ChildItem -Path $PayloadDir -Recurse | ForEach-Object { Write-Host $_.FullName }
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Installer payload must contain YukiHub.exe and YukiHubUpdater.exe."
          }

          $SigningDir = "build/signing/installer-payload"
          if (Test-Path $SigningDir) { Remove-Item $SigningDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          Copy-Item "$PayloadDir/YukiHub.exe" -Destination $SigningDir -Force
          Copy-Item "build/bin/YukiHubUpdater.exe" -Destination $SigningDir -Force
        shell: pwsh

      - name: 上传未签名便携版
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable
          path: build/bin/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
          retention-days: 1

      - name: 提交便携版签名（SignPath）
        # 未配置 SignPath（本仓库默认）时跳过：产物不带签名，但照常打包上传。
        # 想启用签名：配好仓库 Variables 的 SIGNPATH_* 即可，无需改本文件。
        if: matrix.mode == 'portable' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG || 'github-portable' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed

      - name: 准备便携版制品
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $Version = "${{ steps.get_version.outputs.VERSION }}"
          $Arch = "${{ matrix.arch }}"
          $SignedZip = "signed/YukiHub-$Version-windows-$Arch-portable.zip"
          $UnsignedZip = "build/bin/YukiHub-$Version-windows-$Arch-portable.zip"

          if ($env:SIGNING_ENABLED -eq 'true') {
            if (!(Test-Path $SignedZip)) {
              Get-ChildItem -Path signed -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw "Signed portable artifact not found: $SignedZip"
            }
          } else {
            New-Item -ItemType Directory -Force -Path "signed" | Out-Null
            Copy-Item $UnsignedZip -Destination $SignedZip -Force
            Write-Host "SignPath 未配置：跳过签名，使用未签名便携版 $SignedZip"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP "yukihub-portable-payload"
          if (Test-Path $ExtractDir) { Remove-Item $ExtractDir -Recurse -Force }
          Expand-Archive -Path $SignedZip -DestinationPath $ExtractDir -Force
          $PayloadDir = (Get-ChildItem $ExtractDir -Filter "YukiHub.exe" -Recurse | Select-Object -First 1).Directory.FullName
          if ([string]::IsNullOrWhiteSpace($PayloadDir)) {
            throw "Portable archive does not contain YukiHub.exe."
          }
          foreach ($Name in @("YukiHub.exe", "YukiHubUpdater.exe")) {
            $Path = Join-Path $PayloadDir $Name
            if (!(Test-Path $Path)) { throw "Portable archive is missing $Name." }
            if ($env:SIGNING_ENABLED -eq 'true') {
              $Signature = Get-AuthenticodeSignature $Path
              if ($Signature.Status -ne "Valid") {
                throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
              }
            }
          }

          $RuntimeDir = Join-Path $PWD "update-runtime"
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @("YukiHub.exe", "YukiHubUpdater.exe", "duckdb.dll")) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path (Join-Path $PayloadDir "7z")) {
            Copy-Item (Join-Path $PayloadDir "7z") -Destination $RuntimeDir -Recurse -Force
          }

      - name: 上传便携版制品
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable
          path: signed/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: 上传未签名安装版载荷
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-installer-payload
          path: build/signing/installer-payload/
          if-no-files-found: error
          retention-days: 1

      - name: 提交安装版载荷签名（SignPath）
        if: matrix.mode == 'installer' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-installer-payload' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-payload

      - name: 基于（可能已签名的）载荷构建安装包
        if: matrix.mode == 'installer'
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:SIGNING_ENABLED -eq 'true') {
            $Gui = "signed-payload/YukiHub.exe"
            $Updater = "signed-payload/YukiHubUpdater.exe"
            if (!(Test-Path $Gui) -or !(Test-Path $Updater)) {
              Get-ChildItem -Path signed-payload -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw "Signed installer payload must contain YukiHub.exe and YukiHubUpdater.exe."
            }
            foreach ($Path in @($Gui, $Updater)) {
              $Signature = Get-AuthenticodeSignature $Path
              if ($Signature.Status -ne "Valid") {
                throw "$(Split-Path $Path -Leaf) does not have a valid Authenticode signature: $($Signature.Status)"
              }
            }
          } else {
            $Gui = "build/signing/installer-payload/YukiHub.exe"
            $Updater = "build/signing/installer-payload/YukiHubUpdater.exe"
            Write-Host "SignPath 未配置：跳过签名，使用未签名安装版载荷"
          }

          $PayloadDir = "build/windows/payload/${{ matrix.arch }}"
          Copy-Item $Gui -Destination "$PayloadDir/YukiHub.exe" -Force
          Copy-Item $Updater -Destination "build/bin/YukiHubUpdater.exe" -Force

          .\scripts\build.bat "installer-package" "${{ steps.get_version.outputs.VERSION }}" "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = "build/bin/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe"
          if (!(Test-Path $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Installer artifact not found: $Artifact"
          }

          $RuntimeDir = Join-Path $PWD "update-runtime"
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @("YukiHubUpdater.exe", "duckdb.dll")) {
            $Source = Join-Path "build/bin" $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          foreach ($Name in @("YukiHub.exe")) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path "build/bin/7z") {
            Copy-Item "build/bin/7z" -Destination $RuntimeDir -Recurse -Force
          }
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

      - name: 上传更新运行时输入
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: update-runtime/
          if-no-files-found: error

      - name: 上传未签名安装包
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-installer
          path: build/bin/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: 提交安装包签名（SignPath）
        if: matrix.mode == 'installer' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-installer

      - name: 准备安装包制品
        if: matrix.mode == 'installer'
        run: |
          $ErrorActionPreference = "Stop"
          $Version = "${{ steps.get_version.outputs.VERSION }}"
          $Arch = "${{ matrix.arch }}"
          $Artifact = "signed-installer/YukiHub-$Version-windows-$Arch-setup.exe"

          if ($env:SIGNING_ENABLED -eq 'true') {
            if (!(Test-Path $Artifact)) {
              Get-ChildItem -Path signed-installer -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw "Signed installer artifact not found: $Artifact"
            }
          } else {
            New-Item -ItemType Directory -Force -Path "signed-installer" | Out-Null
            Copy-Item "build/bin/YukiHub-$Version-windows-$Arch-setup.exe" -Destination $Artifact -Force
            Write-Host "SignPath 未配置：跳过签名，使用未签名安装包 $Artifact"
          }
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

      - name: 上传安装包制品
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-installer
          path: signed-installer/YukiHub-${{ steps.get_version.outputs.VERSION }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  build-linux:
    name: 构建 Linux amd64 安装包
    needs: [validate]
    # 手动运行时看 build_linux 有没有勾；标签推送时 inputs 为空 → 视为勾选
    if: ${{ inputs.build_linux != false }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读取版本号（由 validate 统一解析）
        id: get_version
        run: echo "VERSION=${{ needs.validate.outputs.version }}" >> $GITHUB_OUTPUT

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装 Linux 构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl desktop-file-utils libayatana-appindicator3-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: 安装 nFPM
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm --version

      - name: 安装 appimagetool
        shell: bash
        run: |
          set -euo pipefail
          tool_path="${RUNNER_TEMP:-/tmp}/appimagetool-x86_64.AppImage"
          curl -fsSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o "$tool_path"
          chmod 755 "$tool_path"
          sudo install -m 0755 "$tool_path" /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: 安装匹配版本的 Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: 修补 Wails Linux 托盘支持
        shell: bash
        run: ./scripts/patch-wails-linux-tray.sh

      - name: 构建 Linux 安装包
        shell: bash
        env:
          YUKIHUB_UPDATE_SERVICE_URL: ${{ vars.YUKIHUB_UPDATE_SERVICE_URL }}
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_HIKARINAGI_CLIENT_SECRET: ${{ secrets.YUKIHUB_HIKARINAGI_CLIENT_SECRET }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh all '${{ steps.get_version.outputs.VERSION }}' 'amd64'
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.deb' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.rpm' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.AppImage' | wc -l | tr -d ' ')" -eq 1

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ steps.get_version.outputs.VERSION }}-linux-amd64
          path: |
            build/bin/YukiHub-*-linux-amd64.deb
            build/bin/YukiHub-*-linux-amd64.rpm
            build/bin/YukiHub-*-linux-amd64.AppImage
          if-no-files-found: error

  create-release:
    name: 创建 Release（正式 / 预览）
    # **不要**把 build-linux 加进 needs：Linux 打包链依赖 GTK4/WebKitGTK6/nfpm/appimagetool
    # 与 scripts/patch-wails-linux-tray.sh，任何一环出问题都不应该让 Windows 正式版发不出去。
    # Linux 产物是可选增量，下面按「0 个或 3 个」放行。
    needs: [validate, build-release]
    # 手动运行时允许只发一个平台：只要求「被勾选的那些平台」成功。
    # 发布方式选「仅构建产物」时整块跳过（validate 已把 inputs 解析成 needs.validate.outputs.channel）；
    # 版本号与标签由 validate 统一解析（version 输入或 v*.*.* 标签），这里不再直接依赖 ref。
    if: >-
      always()
      && needs.validate.result == 'success'
      && needs.validate.outputs.channel != 'artifact'
      && (inputs.build_windows == false || needs.build-release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: 读取版本号（由 validate 统一解析）
        id: get_version
        run: echo "VERSION=${{ needs.validate.outputs.version }}" >> $GITHUB_OUTPUT

      - name: 下载全部制品
        uses: actions/download-artifact@v4
        with:
          pattern: yukihub-*
          path: ./artifacts
          merge-multiple: true

      - name: 下载已签名的更新运行时输入
        uses: actions/download-artifact@v4
        with:
          pattern: update-runtime-*
          path: ./update-runtime-artifacts

      - name: 列出下载到的文件
        run: ls -R ./artifacts

      - name: 整理发布文件
        run: |
          mkdir -p release
          find ./artifacts -maxdepth 1 -type f \( -name "*.zip" -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} ./release/ \;

          # Windows 四件套（portable / installer × amd64 / arm64）是发布的硬要求；
          # 手动运行时没勾 Windows 就不做这项断言（`!= false` 在 tag 推送时为 true）。
          if [ "${{ inputs.build_windows != false }}" = "true" ]; then
            windows_count="$(find ./release -maxdepth 1 -type f \( -name "*.zip" -o -name "*.exe" \) | wc -l | tr -d ' ')"
            test "$windows_count" -eq 4
          fi

          # Linux（deb / rpm / AppImage）为可选：build-linux 失败时这里会是 0，
          # 但只补齐一半（例如只出了 deb）说明产物链异常，仍然拦下。
          if [ "${{ inputs.build_linux != false }}" = "true" ]; then
            linux_count="$(find ./release -maxdepth 1 -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) | wc -l | tr -d ' ')"
            case "$linux_count" in
              0 | 3) ;;
              *)
                echo "Linux 产物数量异常：$linux_count（应为 0 或 3）"
                exit 1
                ;;
            esac
          fi

          ls -lh ./release

      - name: 查找上一个稳定版
        id: previous_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          CURRENT_TAG="${{ needs.validate.outputs.tag }}"
          PREVIOUS_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName,isDraft,isPrerelease --jq "[.[] | select(.isDraft == false and .isPrerelease == false and .tagName != \"$CURRENT_TAG\")][0].tagName // \"\"")"
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p previous-update-assets
          if [ -n "$PREVIOUS_TAG" ]; then
            aws s3 cp \
              "s3://${UPDATE_S3_BUCKET}/releases/${PREVIOUS_VERSION}/" \
              ./previous-update-assets/ \
              --recursive \
              --exclude "*" \
              --include "YukiHub-${PREVIOUS_VERSION}-windows-*-YukiHub.exe.zst" \
              --endpoint-url "$UPDATE_S3_ENDPOINT" || true
          fi

      - name: 安装 Zstandard 命令行工具
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: 生成全量与增量更新资产
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          PREVIOUS_VERSION: ${{ steps.previous_release.outputs.version }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          test -n "$UPDATE_PUBLIC_BASE_URL"
          ASSET_BASE_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/assets"
          ARGS=(
            --input-root "$GITHUB_WORKSPACE/update-runtime-artifacts"
            --previous-root "$GITHUB_WORKSPACE/previous-update-assets"
            --output "$GITHUB_WORKSPACE/update-assets"
            --version "$VERSION"
            --asset-base-url "$ASSET_BASE_URL"
            --event-url "${UPDATE_PUBLIC_BASE_URL%/}/v1/events"
          )
          if [ -n "$PREVIOUS_VERSION" ]; then
            ARGS+=(--previous-version "$PREVIOUS_VERSION")
          fi
          go -C updater run ./cmd/yukihub-update-builder "${ARGS[@]}"
          jq empty "update-assets/YukiHub-${VERSION}-update-manifest.json"
          ls -lh ./update-assets

      - name: 生成更新版本文件（version.json）
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          SOURCE_FILE="sync/version.json"
          SOURCE_VERSION="$(jq -r '.version // empty' "$SOURCE_FILE")"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "::error::$SOURCE_FILE 里的版本（$SOURCE_VERSION）与本次发布版本（$VERSION）不一致。请先把 $SOURCE_FILE 的 version 改成 $VERSION 并提交，再重新发布。"
            exit 1
          fi
          cp "$SOURCE_FILE" update-assets/version.json
          jq empty update-assets/version.json

      - name: 上传更新资产到 S3
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          test -n "$UPDATE_S3_BUCKET"
          test -n "$UPDATE_S3_ENDPOINT"
          PREFIX="s3://${UPDATE_S3_BUCKET}/releases/${VERSION}"
          aws s3 cp ./update-assets "$PREFIX/" \
            --recursive \
            --exclude "*" \
            --include "*.zst" \
            --include "*.zsdiff" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp "update-assets/YukiHub-${VERSION}-update-manifest.json" "$PREFIX/manifest.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp update-assets/version.json "$PREFIX/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"

      - name: 生成发布说明
        id: release_notes
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # 检查是否存在 CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            # 提取当前版本的 changelog
            # 命中 ## VERSION / ## vVERSION 后，输出到下一个二级标题前为止
            awk -v version="$VERSION" '
              function normalize_heading(line, heading) {
                heading = line
                sub(/^##[[:space:]]+/, "", heading)
                sub(/^v/, "", heading)
                sub(/[[:space:]]+$/, "", heading)
                return heading
              }

              /^##[[:space:]]+/ {
                current = normalize_heading($0)
                if (found && current != version) {
                  exit
                }
                if (current == version) {
                  found = 1
                }
              }

              found {
                print
              }
            ' CHANGELOG.md > release_notes.md

            # 如果没有找到对应版本的内容，文件会是空的
            if [ ! -s release_notes.md ]; then
              echo "未找到版本 ${VERSION} 的 changelog，使用默认模板"
              rm -f release_notes.md
            fi
          fi

          # 如果没有从 CHANGELOG.md 提取到内容，使用默认模板
          if [ ! -f "release_notes.md" ]; then
            cat << EOF > release_notes.md
          ## YukiHub ${{ steps.get_version.outputs.VERSION }}

          ### 📝 更新内容

          请查看 [Commits](https://github.com/${{ github.repository }}/commits/${{ needs.validate.outputs.tag }})
          EOF
          fi

          # 添加下载说明
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          if [ "${{ needs.validate.outputs.channel }}" = "prerelease" ]; then
            echo "> ⚠️ **这是一个预览版（pre-release）**：不进入应用内的稳定更新通道。" >> release_notes.md
            echo "" >> release_notes.md
          fi
          echo "### 📦 下载说明" >> release_notes.md
          echo "" >> release_notes.md
          echo "| 文件 | 说明 |" >> release_notes.md
          echo "|------|------|" >> release_notes.md
          echo "| \`*-windows-*-portable.zip\` | Windows 便携版，解压即用，数据存储在程序目录 |" >> release_notes.md
          echo "| \`*-windows-*-setup.exe\` | Windows 安装版，数据存储在 %APPDATA%\\\\YukiHub |" >> release_notes.md
          # Linux 产物是可选的（build-linux 失败不会阻断本作业），只有真的产出了才列出，
          # 避免发布说明公示并不存在的文件。
          linux_count="$(find ./release -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | wc -l | tr -d ' ')"
          if [ "$linux_count" -gt 0 ]; then
            echo "| \`*-linux-*.AppImage\` | Linux AppImage，依赖系统 GTK4 / WebKitGTK 6.0 运行库 |" >> release_notes.md
            echo "| \`*-linux-*.deb\` | Linux Debian/Ubuntu 安装包 |" >> release_notes.md
            echo "| \`*-linux-*.rpm\` | Linux Fedora/RHEL/openSUSE 安装包 |" >> release_notes.md
          fi
          echo "" >> release_notes.md
          if [ "$linux_count" -gt 0 ]; then
            echo "Windows 提供 AMD64、ARM64；Linux 提供 AMD64。" >> release_notes.md
          else
            echo "Windows 提供 AMD64、ARM64。" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "### 🔗 相关链接" >> release_notes.md
          echo "" >> release_notes.md
          echo "- [查看所有提交](https://github.com/${{ github.repository }}/commits/${{ needs.validate.outputs.tag }})" >> release_notes.md

          cat release_notes.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release_notes.md
          draft: false
          # 显式指定标签：从分支手动发布时标签可能还不存在，由本步骤自动创建。
          # target_commitish 必须给：不给的话 API 会拿「默认分支的 HEAD」建标签，
          # 从非 main 分支发布时标签就会指错提交。标签已存在时该参数被忽略。
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.get_version.outputs.VERSION }}
          # 只有「预览版」才是 pre-release；标签推送时 channel=release → 正式版
          prerelease: ${{ needs.validate.outputs.channel == 'prerelease' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布到稳定更新通道
        # 只有「正式版」才写入稳定通道（预览版与仅构建产物都不写）
        if: ${{ needs.validate.outputs.channel == 'release' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          aws s3 cp update-assets/version.json "s3://${UPDATE_S3_BUCKET}/channels/stable/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=60" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
