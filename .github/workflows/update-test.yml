# 应用内更新链路验证（自上游 LunaBox 继承，YukiHub for Desktop 需重新配置后使用）。
#
# 触发方式：仅手动 workflow_dispatch。
#
# 依赖与 release.yml 相同的 UPDATE_S3_* / UPDATE_PUBLIC_BASE_URL 配置。
# 只有在自建更新服务可用后，本工作流才有实际意义。
name: 更新链路测试发布

on:
  workflow_dispatch:
    inputs:
      version:
        description: '测试版本号（不含 v，格式：1.11.0-test.1）'
        required: true
        type: string
      previous_tag:
        description: '可选：用于生成 delta 的上一 release tag（例如 v1.11.0-test.1）'
        required: false
        type: string

run-name: Test update v${{ inputs.version }} from ${{ github.ref_name }}

concurrency:
  group: test-update-${{ inputs.version }}
  cancel-in-progress: false

env:
  YUKIHUB_UPDATE_SERVICE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}

jobs:
  prepare:
    name: 校验测试发布参数
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      previous_version: ${{ steps.release.outputs.previous_version }}

    steps:
      - name: 拉取指定分支代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验测试发布参数
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          VERSION="$(echo "$INPUT_VERSION" | xargs)"
          PREVIOUS_TAG="$(echo "$INPUT_PREVIOUS_TAG" | xargs)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
            echo "version must use X.Y.Z-test.N without a leading v" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists; test tags are immutable" >&2
            exit 1
          fi

          PREVIOUS_VERSION=""
          if [ -n "$PREVIOUS_TAG" ]; then
            if [[ ! "$PREVIOUS_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "previous_tag must be a SemVer tag beginning with v" >&2
              exit 1
            fi
            gh release view "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

  build-prerelease:
    name: 构建 Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: amd64
            mode: installer
            runner: windows-2025

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装 NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH

      - name: 安装匹配版本的 Wails v3 CLI
        shell: pwsh
        run: |
          $Version = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3).Trim()
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$Version"
          $Installed = (& wails3 version 2>&1 | Out-String).Trim()
          if ($Installed -ne $Version) {
            throw "wails3 version mismatch: expected $Version, found $Installed"
          }

      - name: 构建便携版
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build.bat portable '${{ needs.prepare.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/bin/YukiHub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Portable artifact not found: $Artifact"
          }

          $ExtractDir = 'build/signing/portable-package'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          $PayloadDir = (Get-ChildItem -Path $ExtractDir -Filter 'YukiHub.exe' -Recurse | Select-Object -First 1).Directory.FullName
          if ([string]::IsNullOrWhiteSpace($PayloadDir)) {
            throw 'Portable artifact does not contain YukiHub.exe.'
          }

          $SigningDir = 'build/signing/test-portable-payload'
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          foreach ($Name in @('YukiHub.exe', 'YukiHubUpdater.exe')) {
            $Source = Join-Path $PayloadDir $Name
            if (!(Test-Path -LiteralPath $Source)) {
              throw "Portable artifact is missing $Name."
            }
            Copy-Item -LiteralPath $Source -Destination $SigningDir -Force
          }

      - name: 构建安装版载荷
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build.bat installer-payload '${{ needs.prepare.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $PayloadDir = 'build/windows/payload/${{ matrix.arch }}'
          if (!(Test-Path -LiteralPath "$PayloadDir/YukiHub.exe") -or !(Test-Path -LiteralPath 'build/bin/YukiHubUpdater.exe')) {
            throw 'Installer payload must contain YukiHub.exe and YukiHubUpdater.exe.'
          }

          $SigningDir = 'build/signing/test-installer-payload'
          if (Test-Path -LiteralPath $SigningDir) {
            Remove-Item -LiteralPath $SigningDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          Copy-Item -LiteralPath "$PayloadDir/YukiHub.exe" -Destination $SigningDir -Force
          Copy-Item -LiteralPath 'build/bin/YukiHubUpdater.exe' -Destination $SigningDir -Force

      - name: 上传未签名便携版
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: build/signing/test-portable-payload/
          if-no-files-found: error
          retention-days: 1

      - name: 提交便携版签名（SignPath）
        # 未配置 SignPath（本仓库默认）时跳过：产物不带签名，但照常打包上传。
        if: matrix.mode == 'portable' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_TEST_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-test-installer-payload-v3' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-portable-payload

      - name: 校验已签名便携版
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $UnsignedArtifact = 'build/bin/YukiHub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'

          if ($env:SIGNING_ENABLED -eq 'true') {
            $SignedPayloadDir = 'signed-portable-payload'
            foreach ($Name in @('YukiHub.exe', 'YukiHubUpdater.exe')) {
              $SignedFile = Join-Path $SignedPayloadDir $Name
              if (!(Test-Path -LiteralPath $SignedFile)) {
                Get-ChildItem -Path $SignedPayloadDir -Recurse | ForEach-Object { Write-Host $_.FullName }
                throw "Signed portable payload is missing $Name."
              }
              $Signature = Get-AuthenticodeSignature $SignedFile
              if ($Signature.Status -ne 'Valid') {
                throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
              }
            }
          } else {
            $SignedPayloadDir = 'build/signing/test-portable-payload'
            Write-Host 'SignPath 未配置：跳过签名，使用未签名便携版载荷'
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'yukihub-signed-portable'
          if (Test-Path $ExtractDir) { Remove-Item $ExtractDir -Recurse -Force }
          Expand-Archive -LiteralPath $UnsignedArtifact -DestinationPath $ExtractDir -Force
          $PayloadDir = (Get-ChildItem $ExtractDir -Filter 'YukiHub.exe' -Recurse | Select-Object -First 1).Directory.FullName
          if ([string]::IsNullOrWhiteSpace($PayloadDir)) {
            throw 'Portable artifact does not contain YukiHub.exe.'
          }
          foreach ($Name in @('YukiHub.exe', 'YukiHubUpdater.exe')) {
            Copy-Item -LiteralPath (Join-Path $SignedPayloadDir $Name) -Destination $PayloadDir -Force
          }

          New-Item -ItemType Directory -Force -Path 'signed' | Out-Null
          $Artifact = 'signed/YukiHub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (Test-Path -LiteralPath $Artifact) { Remove-Item -LiteralPath $Artifact -Force }
          Compress-Archive -LiteralPath $PayloadDir -DestinationPath $Artifact -CompressionLevel Optimal

          $RuntimeDir = Join-Path $PWD 'update-runtime'
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @('YukiHub.exe', 'YukiHubUpdater.exe', 'duckdb.dll')) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path (Join-Path $PayloadDir '7z')) {
            Copy-Item (Join-Path $PayloadDir '7z') -Destination $RuntimeDir -Recurse -Force
          }

      - name: 上传便携版制品
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: signed/YukiHub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: 上传未签名安装版载荷
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer-payload
          path: build/signing/test-installer-payload/
          if-no-files-found: error
          retention-days: 1

      - name: 提交安装版载荷签名（SignPath）
        if: matrix.mode == 'installer' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_TEST_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-test-installer-payload-v3' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-payload

      - name: 基于（可能已签名的）载荷构建安装包
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SIGNING_ENABLED -eq 'true') {
            $SignedGui = 'signed-payload/YukiHub.exe'
            $SignedUpdater = 'signed-payload/YukiHubUpdater.exe'
            if (!(Test-Path -LiteralPath $SignedGui) -or !(Test-Path -LiteralPath $SignedUpdater)) {
              Get-ChildItem -Path signed-payload -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw 'Signed installer payload must contain YukiHub.exe and YukiHubUpdater.exe.'
            }
            foreach ($Path in @($SignedGui, $SignedUpdater)) {
              $Signature = Get-AuthenticodeSignature $Path
              if ($Signature.Status -ne "Valid") {
                throw "$(Split-Path $Path -Leaf) does not have a valid Authenticode signature: $($Signature.Status)"
              }
            }
          } else {
            $SignedGui = 'build/signing/test-installer-payload/YukiHub.exe'
            $SignedUpdater = 'build/signing/test-installer-payload/YukiHubUpdater.exe'
            Write-Host 'SignPath 未配置：跳过签名，使用未签名安装版载荷'
          }

          $PayloadDir = 'build/windows/payload/${{ matrix.arch }}'
          Copy-Item -LiteralPath $SignedGui -Destination "$PayloadDir/YukiHub.exe" -Force
          Copy-Item -LiteralPath $SignedUpdater -Destination 'build/bin/YukiHubUpdater.exe' -Force

          .\scripts\build.bat installer-package '${{ needs.prepare.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/bin/YukiHub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            Get-ChildItem -Path "build/bin" -Recurse | ForEach-Object { Write-Host $_.FullName }
            throw "Installer artifact not found: $Artifact"
          }

          $RuntimeDir = Join-Path $PWD "update-runtime"
          if (Test-Path $RuntimeDir) { Remove-Item $RuntimeDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $RuntimeDir | Out-Null
          foreach ($Name in @("YukiHubUpdater.exe", "duckdb.dll")) {
            $Source = Join-Path "build/bin" $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          foreach ($Name in @("YukiHub.exe")) {
            $Source = Join-Path $PayloadDir $Name
            if (Test-Path $Source) { Copy-Item $Source -Destination $RuntimeDir -Force }
          }
          if (Test-Path "build/bin/7z") {
            Copy-Item "build/bin/7z" -Destination $RuntimeDir -Recurse -Force
          }

      - name: 上传更新运行时输入
        uses: actions/upload-artifact@v4
        with:
          name: update-runtime-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-${{ matrix.mode }}
          path: update-runtime/
          if-no-files-found: error

      - name: 上传未签名安装包
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: build/bin/YukiHub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: 提交安装包签名（SignPath）
        if: matrix.mode == 'installer' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-installer

      - name: 准备安装包制品
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          SIGNING_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $ErrorActionPreference = "Stop"
          $Version = "${{ needs.prepare.outputs.version }}"
          $Arch = "${{ matrix.arch }}"
          $Artifact = "signed-installer/YukiHub-$Version-windows-$Arch-setup.exe"

          if ($env:SIGNING_ENABLED -eq 'true') {
            if (!(Test-Path $Artifact)) {
              Get-ChildItem -Path signed-installer -Recurse | ForEach-Object { Write-Host $_.FullName }
              throw "Signed installer artifact not found: $Artifact"
            }
          } else {
            New-Item -ItemType Directory -Force -Path "signed-installer" | Out-Null
            Copy-Item "build/bin/YukiHub-$Version-windows-$Arch-setup.exe" -Destination $Artifact -Force
            Write-Host "SignPath 未配置：跳过签名，使用未签名安装包 $Artifact"
          }

      - name: 上传安装包制品
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: signed-installer/YukiHub-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  create-prerelease:
    name: 创建更新测试版 Release
    needs: [prepare, build-prerelease]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: 生成版本号
        id: version_info
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          COMMIT="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "COMMIT=$COMMIT" >> $GITHUB_OUTPUT

      - name: 下载全部制品
        uses: actions/download-artifact@v4
        with:
          pattern: yukihub-*
          path: ./artifacts

      - name: 下载已签名的更新运行时输入
        uses: actions/download-artifact@v4
        with:
          pattern: update-runtime-*
          path: ./update-runtime-artifacts

      - name: 列出下载到的文件
        run: ls -R ./artifacts

      - name: 整理发布文件
        run: |
          mkdir -p release
          find ./artifacts -type f \( -name "*.zip" -o -name "*.exe" \) -exec cp {} ./release/ \;
          ls -lh ./release

      - name: 下载上一版更新基线
        if: needs.prepare.outputs.previous_tag != ''
        env:
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          mkdir -p previous-update-assets
          aws s3 cp \
            "s3://${UPDATE_S3_BUCKET}/releases/${PREVIOUS_VERSION}/" \
            ./previous-update-assets/ \
            --recursive \
            --exclude "*" \
            --include "YukiHub-${PREVIOUS_VERSION}-windows-*-YukiHub.exe.zst" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"

      - name: 安装 Zstandard 命令行工具
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: 生成全量与增量更新资产
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.prepare.outputs.previous_version }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          test -n "$UPDATE_PUBLIC_BASE_URL"
          ASSET_BASE_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/assets"
          ARGS=(
            --input-root "$GITHUB_WORKSPACE/update-runtime-artifacts"
            --output "$GITHUB_WORKSPACE/update-assets"
            --version "$VERSION"
            --asset-base-url "$ASSET_BASE_URL"
            --event-url "${UPDATE_PUBLIC_BASE_URL%/}/v1/events"
            --architectures amd64
          )
          if [ -n "$PREVIOUS_VERSION" ]; then
            ARGS+=(
              --previous-root "$GITHUB_WORKSPACE/previous-update-assets"
              --previous-version "$PREVIOUS_VERSION"
            )
          fi
          go -C updater run ./cmd/yukihub-update-builder "${ARGS[@]}"
          jq empty "update-assets/YukiHub-${VERSION}-update-manifest.json"

      - name: 生成测试版本文件（version.json）
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          SOURCE_FILE="sync/version-test.json"
          SOURCE_VERSION="$(jq -r '.version // empty' "$SOURCE_FILE")"
          if [ "$SOURCE_VERSION" != "$VERSION" ]; then
            echo "$SOURCE_FILE version $SOURCE_VERSION does not match release version $VERSION" >&2
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          MANIFEST_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/manifest"
          jq \
            --arg release_url "$RELEASE_URL" \
            --arg manifest_url "$MANIFEST_URL" \
            '.downloads.github = $release_url | .update_manifest_url = $manifest_url' \
            "$SOURCE_FILE" > "update-assets/version.json"
          jq empty "update-assets/version.json"

      - name: 上传更新资产到 S3
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.UPDATE_S3_REGION || 'auto' }}
          UPDATE_S3_BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          UPDATE_S3_ENDPOINT: ${{ vars.UPDATE_S3_ENDPOINT }}
        run: |
          test -n "$UPDATE_S3_BUCKET"
          test -n "$UPDATE_S3_ENDPOINT"
          PREFIX="s3://${UPDATE_S3_BUCKET}/releases/${VERSION}"
          aws s3 cp ./update-assets "$PREFIX/" \
            --recursive \
            --exclude "*" \
            --include "*.zst" \
            --include "*.zsdiff" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp "update-assets/YukiHub-${VERSION}-update-manifest.json" "$PREFIX/manifest.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"
          aws s3 cp update-assets/version.json "$PREFIX/version.json" \
            --content-type "application/json" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$UPDATE_S3_ENDPOINT"

      - name: 收集最近提交信息
        id: get_commits
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          echo "COMMITS<<EOF" >> $GITHUB_OUTPUT
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..${GITHUB_SHA}" >> $GITHUB_OUTPUT
          else
            git log --pretty=format:"- %s (%h)" -n 5 "$GITHUB_SHA" >> $GITHUB_OUTPUT
          fi
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 生成发布说明
        id: release_notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          UPDATE_PUBLIC_BASE_URL: ${{ vars.UPDATE_PUBLIC_BASE_URL }}
        run: |
          VERSION_SOURCE_URL="${UPDATE_PUBLIC_BASE_URL%/}/v1/releases/${VERSION}/version"
          if [ -n "$PREVIOUS_TAG" ]; then
            UPDATE_KIND="已尝试生成从 ${PREVIOUS_TAG} 到 ${TAG} 的 YukiHub.exe delta；详细结果以 update manifest 中是否包含 patch 为准。"
          else
            UPDATE_KIND="未指定上一版本，本次只生成 full 更新资产。"
          fi

          cat << EOF > release_notes.md
          ## YukiHub 应用内更新测试版

          - 版本：\`${VERSION}\`
          - 分支：\`${{ github.ref_name }}\`
          - 提交：[\`${{ steps.version_info.outputs.COMMIT }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - 构建时间：$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ${UPDATE_KIND}

          ### 更新测试

          将待更新 YukiHub 的 \`update_check_url\` 设为：

          \`${VERSION_SOURCE_URL}\`

          正式 Cloudflare \`version.json\` 不会被此工作流修改。

          ### 版本提交

          ${{ steps.get_commits.outputs.COMMITS }}
          
          ### 下载说明
          
          | 文件 | 说明 |
          |------|------|
          | \`*-portable.zip\` | 便携版，解压即用，数据存储在程序目录 |
          | \`*-setup.exe\` | 安装版，标准安装程序，数据存储在 %APPDATA%\\\\YukiHub |
          
          EOF

          cat release_notes.md

      - name: 创建测试版 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "更新测试版 - ${{ needs.prepare.outputs.version }}"
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
