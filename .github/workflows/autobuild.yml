# Nightly 预发布构建（自上游 LunaBox 继承，YukiHub for Windows 需重新配置后使用）。
#
# 触发方式：仅手动 workflow_dispatch。
#
# 依赖与 release.yml 相同的 Variables / Secrets，并额外依赖 SignPath 签名配置。
# 在上线自建更新服务之前，不要在本仓库启用定时触发，否则会产生无法消费的构建产物。
name: 开发版快照（dev-latest）

on:
  # 仅手动触发。两个平台默认都勾，可以只构建其中一个（例如只验 Linux 打包链）。
  #
  # 与 release.yml（发布版本）的区别：这里的版本号是自动生成的
  # `<最近标签>-dev.<提交数>+<短SHA>`，跟任何正式版本号无关，产物固定覆盖
  # 滚动预发布 `dev-latest`。它就是「把当前 main 编一份能装的包」，不发正式版。
  workflow_dispatch:
    inputs:
      publish:
        description: '发布方式：仅构建产物＝只产出 Actions 制品；发布开发版＝把这次构建覆盖到滚动预发布 dev-latest（永远标 pre-release，不影响稳定更新通道）'
        required: false
        type: choice
        default: '仅构建产物（不发布）'
        options:
          - '仅构建产物（不发布）'
          - '发布开发版（覆盖 dev-latest）'
      build_windows:
        description: '构建 Windows（portable + installer × amd64 / arm64）'
        required: false
        type: boolean
        default: true
      build_linux:
        description: '构建 Linux（AppImage + deb + rpm，仅 amd64）'
        required: false
        type: boolean
        default: true

# 运行列表里直接看出本次构建了哪些平台、走哪种发布方式
run-name: 开发版构建${{ inputs.build_windows && ' · Windows' || '' }}${{ inputs.build_linux && ' · Linux' || '' }} · ${{ inputs.publish || '仅构建产物（不发布）' }}

concurrency:
  group: yukihub-dev-prerelease
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: 解析版本号与选项
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      base-version: ${{ steps.version.outputs.base-version }}
      commit: ${{ steps.version.outputs.commit }}
      commit-count: ${{ steps.version.outputs.commit-count }}
      publish: ${{ steps.publish.outputs.mode }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          latest_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo 'v0.0.0')"
          base_version="${latest_tag#v}"
          commit="${GITHUB_SHA:0:7}"
          commit_count="$(git rev-list --count HEAD)"
          version="${base_version}-dev.${commit_count}+${commit}"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base-version=$base_version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "commit-count=$commit_count" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: 校验平台勾选
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_windows }}" != "true" ] && [ "${{ inputs.build_linux }}" != "true" ]; then
            echo "::error::至少要勾选一个平台（build_windows 或 build_linux）。"
            exit 1
          fi

      # 把「发布方式」解析成 artifact / prerelease 两态，供发布作业判断。
      - name: 解析发布方式
        id: publish
        shell: bash
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          case "$INPUT_PUBLISH" in
            '' | '仅构建产物（不发布）' | artifact)
              mode=artifact
              ;;
            '发布开发版（覆盖 dev-latest）' | prerelease)
              mode=prerelease
              ;;
            *)
              echo "::error::未知的发布方式：$INPUT_PUBLISH"
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "artifact" ]; then
            echo "::notice::本次只构建产物：不会创建或覆盖 dev-latest 预发布。产物在本次运行的 Artifacts 区域下载。"
          else
            echo "::notice::本次将覆盖滚动预发布 dev-latest。"
          fi

  build-windows:
    name: 构建 Windows ${{ matrix.arch }} / ${{ matrix.mode }}
    needs: version
    if: ${{ inputs.build_windows }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            mode: portable
            runner: windows-2025
          - arch: arm64
            mode: portable
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
          - arch: amd64
            mode: installer
            runner: windows-2025
          - arch: arm64
            mode: installer
            runner: windows-11-arm
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
    permissions:
      actions: read
      contents: read

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 配置 ARM64 CGO 工具链（MSYS2）
        id: msys2-arm64
        if: matrix.arch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          install: ${{ matrix.toolchain }}

      - name: 导出 ARM64 MSYS2 路径
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $Location = '${{ steps.msys2-arm64.outputs.msys2-location }}'
          if ([string]::IsNullOrWhiteSpace($Location)) {
            throw 'MSYS2 location output is empty.'
          }
          "MSYS2_LOCATION=$Location" >> $env:GITHUB_ENV

      - name: 安装 NSIS
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          'C:\Program Files (x86)\NSIS' >> $env:GITHUB_PATH

      - name: 安装匹配版本的 Wails v3 CLI
        shell: pwsh
        run: |
          $Version = (go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3).Trim()
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$Version"
          $Installed = (& wails3 version 2>&1 | Out-String).Trim()
          if ($Installed -ne $Version) {
            throw "wails3 version mismatch: expected $Version, found $Installed"
          }

      - name: 校验批处理行尾（.bat 必须 CRLF）
        # .gitattributes 里 *.bat 是 eol=crlf：cmd.exe 解析 LF-only 的 .bat 会把多行
        # `( )` 块和 `for /f` 拆错（满屏「'xx' 不是内部或外部命令」），Windows 构建会中途挂掉。
        shell: pwsh
        run: |
          $bad = @(Get-ChildItem scripts/*.bat | Where-Object {
            -not (Get-Content -LiteralPath $_.FullName -Raw).Contains([char]13)
          })
          if ($bad.Count -gt 0) {
            throw "以下批处理文件不是 CRLF 行尾：$($bad.Name -join ', ')。请检查 .gitattributes 的 *.bat text eol=crlf 规则并重新检出。"
          }
          Write-Host "scripts/*.bat 均为 CRLF 行尾 · OK"

      - name: 构建便携版
        if: matrix.mode == 'portable'
        shell: pwsh
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build.bat portable '${{ needs.version.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/bin/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'yukihub-portable-check'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          foreach ($Name in @('YukiHub.exe', 'YukiHubUpdater.exe')) {
            if (!(Get-ChildItem -Path $ExtractDir -Filter $Name -Recurse -File | Select-Object -First 1)) {
              throw "Portable artifact is missing $Name."
            }
          }

      - name: 构建安装版载荷
        if: matrix.mode == 'installer'
        shell: pwsh
        env:
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\build.bat installer-payload '${{ needs.version.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (!(Test-Path -LiteralPath 'build/windows/payload/${{ matrix.arch }}/YukiHub.exe') -or !(Test-Path -LiteralPath 'build/bin/YukiHubUpdater.exe')) {
            throw 'Installer payload must contain YukiHub.exe and YukiHubUpdater.exe.'
          }

          $SigningDir = 'build/signing/installer-payload'
          if (Test-Path -LiteralPath $SigningDir) {
            Remove-Item -LiteralPath $SigningDir -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $SigningDir | Out-Null
          Copy-Item -LiteralPath 'build/windows/payload/${{ matrix.arch }}/YukiHub.exe' -Destination $SigningDir -Force
          Copy-Item -LiteralPath 'build/bin/YukiHubUpdater.exe' -Destination $SigningDir -Force

      - name: 上传未签名便携版
        id: upload-unsigned-portable
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: build/bin/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error
          retention-days: 1

      - name: 提交便携版签名（SignPath）
        if: matrix.mode == 'portable'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_PORTABLE_ARTIFACT_CONFIGURATION_SLUG || 'github-portable' }}
          github-artifact-id: ${{ steps.upload-unsigned-portable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed

      - name: 校验已签名便携版
        if: matrix.mode == 'portable'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Artifact = 'signed/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Signed portable artifact not found: $Artifact"
          }

          $ExtractDir = Join-Path $env:RUNNER_TEMP 'yukihub-signed-portable-check'
          if (Test-Path -LiteralPath $ExtractDir) {
            Remove-Item -LiteralPath $ExtractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $Artifact -DestinationPath $ExtractDir -Force
          foreach ($Name in @('YukiHub.exe', 'YukiHubUpdater.exe')) {
            $SignedFile = Get-ChildItem -Path $ExtractDir -Filter $Name -Recurse -File | Select-Object -First 1
            if ($null -eq $SignedFile) {
              throw "Signed portable artifact is missing $Name."
            }
            $Signature = Get-AuthenticodeSignature $SignedFile.FullName
            if ($Signature.Status -ne 'Valid') {
              throw "$Name does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

      - name: 上传便携版制品
        if: matrix.mode == 'portable'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable
          path: signed/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
          if-no-files-found: error

      - name: 上传未签名安装版载荷
        id: upload-unsigned-installer-payload
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer-payload
          path: build/signing/installer-payload/
          if-no-files-found: error
          retention-days: 1

      - name: 提交安装版载荷签名（SignPath）
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_PAYLOAD_ARTIFACT_CONFIGURATION_SLUG || 'github-installer-payload' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-payload

      - name: 基于已签名载荷构建安装包
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $SignedGui = 'signed-payload/YukiHub.exe'
          $SignedUpdater = 'signed-payload/YukiHubUpdater.exe'
          if (!(Test-Path -LiteralPath $SignedGui) -or !(Test-Path -LiteralPath $SignedCli) -or !(Test-Path -LiteralPath $SignedUpdater)) {
            throw 'Signed installer payload must contain YukiHub.exe and YukiHubUpdater.exe.'
          }
          foreach ($Path in @($SignedGui, $SignedCli, $SignedUpdater)) {
            $Signature = Get-AuthenticodeSignature $Path
            if ($Signature.Status -ne 'Valid') {
              throw "$(Split-Path $Path -Leaf) does not have a valid Authenticode signature: $($Signature.Status)"
            }
          }

          $PayloadDir = 'build/windows/payload/${{ matrix.arch }}'
          Copy-Item -LiteralPath $SignedGui -Destination "$PayloadDir/YukiHub.exe" -Force
          Copy-Item -LiteralPath $SignedUpdater -Destination 'build/bin/YukiHubUpdater.exe' -Force
          .\scripts\build.bat installer-package '${{ needs.version.outputs.version }}' '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $Artifact = 'build/bin/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Installer artifact not found: $Artifact"
          }

      - name: 上传未签名安装包
        id: upload-unsigned-installer
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-yukihub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: build/bin/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: 提交安装包签名（SignPath）
        if: matrix.mode == 'installer'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG || 'github-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-installer

      - name: 校验已签名安装包
        if: matrix.mode == 'installer'
        shell: pwsh
        run: |
          $Artifact = 'signed-installer/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe'
          if (!(Test-Path -LiteralPath $Artifact)) {
            throw "Signed installer artifact not found: $Artifact"
          }

      - name: 上传安装包制品
        if: matrix.mode == 'installer'
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-installer
          path: signed-installer/YukiHub-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  build-linux:
    name: 构建 Linux amd64 安装包
    needs: version
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            updater/go.sum

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装 Linux 构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates curl desktop-file-utils libayatana-appindicator3-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: 安装 nFPM
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          nfpm --version

      - name: 安装 appimagetool
        shell: bash
        run: |
          set -euo pipefail
          tool_path="${RUNNER_TEMP:-/tmp}/appimagetool-x86_64.AppImage"
          curl -fsSL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o "$tool_path"
          chmod 755 "$tool_path"
          sudo install -m 0755 "$tool_path" /usr/local/bin/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 appimagetool --version

      - name: 安装匹配版本的 Wails v3 CLI
        shell: bash
        run: |
          set -euo pipefail
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"
          test "$(wails3 version 2>&1)" = "$version"

      - name: 修补 Wails Linux 托盘支持
        shell: bash
        run: ./scripts/patch-wails-linux-tray.sh

      - name: 构建 Linux 安装包
        shell: bash
        env:
          YUKIHUB_UPDATE_SERVICE_URL: ${{ vars.YUKIHUB_UPDATE_SERVICE_URL }}
          YUKIHUB_BANGUMI_CLIENT_ID: ${{ vars.YUKIHUB_BANGUMI_CLIENT_ID }}
          YUKIHUB_BANGUMI_CLIENT_SECRET: ${{ secrets.YUKIHUB_BANGUMI_CLIENT_SECRET }}
          YUKIHUB_HIKARINAGI_CLIENT_ID: ${{ vars.YUKIHUB_HIKARINAGI_CLIENT_ID }}
          YUKIHUB_HIKARINAGI_CLIENT_SECRET: ${{ secrets.YUKIHUB_HIKARINAGI_CLIENT_SECRET }}
          YUKIHUB_TOUCHGAL_TOKEN: ${{ secrets.YUKIHUB_TOUCHGAL_TOKEN }}
          YUKIHUB_UMBRA_CLIENT_ID: ${{ vars.YUKIHUB_UMBRA_CLIENT_ID }}
          YUKIHUB_UMBRA_REGISTRATION_TOKEN: ${{ secrets.YUKIHUB_UMBRA_REGISTRATION_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          chmod +x scripts/build.sh
          ./scripts/build.sh all '${{ needs.version.outputs.version }}' 'amd64'
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.deb' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.rpm' | wc -l | tr -d ' ')" -eq 1
          test "$(find build/bin -maxdepth 1 -type f -name 'YukiHub-*-linux-amd64.AppImage' | wc -l | tr -d ' ')" -eq 1

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: yukihub-${{ needs.version.outputs.version }}-linux-amd64
          path: |
            build/bin/YukiHub-*-linux-amd64.deb
            build/bin/YukiHub-*-linux-amd64.rpm
            build/bin/YukiHub-*-linux-amd64.AppImage
          if-no-files-found: error

  create-prerelease:
    name: 发布开发版 pre-release（dev-latest）
    # **不要**把 build-linux 加进 needs：Linux 打包链依赖 GTK4/WebKitGTK6/nfpm/appimagetool
    # 与 scripts/patch-wails-linux-tray.sh，任何一环出问题都不应该让 Windows 发布停摆。
    # Linux 产物是可选增量，下面按「0 个或 3 个」放行。
    needs: [version, build-windows, build-linux]
    # 只要求「被勾选的那些平台」成功：没勾的平台是 skipped，不影响发布。
    # 发布方式选「仅构建产物」时整块跳过（产物已在各构建作业内单独断言过）。
    if: >-
      always()
      && needs.version.result == 'success'
      && needs.version.outputs.publish != 'artifact'
      && (inputs.build_windows || inputs.build_linux)
      && (inputs.build_windows == false || needs.build-windows.result == 'success')
      && (inputs.build_linux == false || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部制品
        uses: actions/download-artifact@v4
        with:
          pattern: yukihub-*
          path: artifacts
          merge-multiple: true

      - name: 整理发布文件
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} release/ \;

          # Windows 四件套（portable / installer × amd64 / arm64）是发布的硬要求；
          # 本次没勾 Windows 就不做这项断言。
          if [ "${{ inputs.build_windows }}" = "true" ]; then
            windows_count="$(find release -maxdepth 1 -type f \( -name '*.zip' -o -name '*.exe' \) | wc -l | tr -d ' ')"
            test "$windows_count" -eq 4
          fi

          # Linux（deb / rpm / AppImage）为可选：build-linux 失败时这里会是 0，
          # 但只补齐一半（例如只出了 deb）说明产物链异常，仍然拦下。
          if [ "${{ inputs.build_linux }}" = "true" ]; then
            linux_count="$(find release -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | wc -l | tr -d ' ')"
            case "$linux_count" in
              0 | 3) ;;
              *)
                echo "Linux 产物数量异常：$linux_count（应为 0 或 3）"
                exit 1
                ;;
            esac
          fi

          find release -maxdepth 1 -type f -printf '%f\n' | sort

      - name: 收集最近提交信息
        id: commits
        shell: bash
        run: |
          {
            echo 'messages<<EOF'
            git log --pretty=format:'- %s (%h)' -n 5
            echo
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 生成发布说明
        shell: bash
        run: |
          build_timestamp="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          cat <<'EOF' > release_notes.md
          ## 🚀 YukiHub Development Build

          **⚠️ 这是一个自动构建的开发版本**

          ### 📋 版本信息

          - **版本号**: `${{ needs.version.outputs.version }}`
          - **基于版本**: `${{ needs.version.outputs.base-version }}`
          - **提交**: [`${{ needs.version.outputs.commit }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **构建时间**: __BUILD_TIMESTAMP__

          ### 📝 最近提交

          ${{ steps.commits.outputs.messages }}

          ### 📦 下载说明

          | 文件 | 说明 |
          |------|------|
          EOF
          # 只列出本次真的构建了的平台
          if [ "${{ inputs.build_windows }}" = "true" ]; then
            echo '| `*-windows-*-portable.zip` | Windows 便携版，解压即用，数据存储在程序目录 |' >> release_notes.md
            echo '| `*-windows-*-setup.exe` | Windows NSIS 安装版，数据存储在 `%APPDATA%\YukiHub` |' >> release_notes.md
          fi
          if [ "${{ inputs.build_linux }}" = "true" ]; then
            echo '| `*-linux-amd64.AppImage` | Linux AppImage，依赖系统 GTK4 / WebKitGTK 6.0 运行库 |' >> release_notes.md
            echo '| `*-linux-amd64.deb` | Linux Debian/Ubuntu 安装包 |' >> release_notes.md
            echo '| `*-linux-amd64.rpm` | Linux Fedora/RHEL/openSUSE 安装包 |' >> release_notes.md
          fi
          platforms=""
          if [ "${{ inputs.build_windows }}" = "true" ]; then platforms="Windows"; fi
          if [ "${{ inputs.build_linux }}" = "true" ]; then platforms="${platforms:+$platforms / }Linux"; fi
          echo "" >> release_notes.md
          echo "> 本次构建平台：$platforms" >> release_notes.md
          cat <<'EOF' >> release_notes.md

          ### ⚠️ 注意事项

          - 此版本为开发测试版本，可能存在未知问题
          - 建议测试前做好数据备份
          - 如遇问题，请在 [Issues](https://github.com/${{ github.repository }}/issues) 中反馈
          EOF
          sed -i "s|__BUILD_TIMESTAMP__|$build_timestamp|" release_notes.md
          cat release_notes.md

      - name: 替换滚动预发布 dev-latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-latest --yes || true
          git push origin :refs/tags/dev-latest || true
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -f dev-latest
          git push -f origin dev-latest

      - name: 发布开发版 pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: 开发版 - ${{ needs.version.outputs.version }}
          files: release/*
          body_path: release_notes.md
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
